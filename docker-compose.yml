services:
  redis:
    image: redis:7.2-alpine
    container_name: meeting-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:16
    container_name: meeting-postgres
    restart: always
    environment:
      POSTGRES_DB: meetingplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meeting-network # Fix: Thêm mạng để Keycloak nhìn thấy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongodb:
    image: mongo:7.0
    container_name: meeting-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: meeting-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: meeting
      RABBITMQ_DEFAULT_PASS: meeting123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  backend:
    build:
      context: .
    container_name: meeting-backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meetingplatform
      REDIS_HOST: redis
      LIVEKIT_HOST: http://livekit:7880
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EGRESS_ENDPOINT: http://minio:9000
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/meetingplatform
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - mongodb
      - rabbitmq
      - livekit
    networks:
      - meeting-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: meeting-keycloak
    command: start-dev --http-enabled=true --hostname-strict-https=false
    restart: always
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/meetingplatform
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - meeting-network

  livekit:
    # v1.13.1+ supports rtc.advertise_internal_ip, required so both public
    # browsers and the Egress worker on this Docker network can reach the SFU.
    image: livekit/livekit-server:v1.13.6
    container_name: meeting-livekit
    restart: always
    environment:
      TZ: Asia/Bangkok
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    command:
      - --config
      - /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  livekit-egress:
    image: livekit/egress:v1.12.0
    container_name: meeting-egress
    restart: always # Thêm để đảm bảo tính sẵn sàng cao
    privileged: true
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      TZ: Asia/Bangkok
    command:
      - --config
      - /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - livekit
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3500M
  minio:
    image: minio/minio:latest
    container_name: meeting-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  coturn:
    image: coturn/coturn:latest
    container_name: meeting-coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - -n --min-port=49152 --max-port=49160
      - --realm=meeting.manhduc --user=ducit:ducpass123
    networks:
      - meeting-network # Fix: Thêm mạng
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: meeting-cloudflare-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - meeting-network
networks:
  meeting-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local # Fix: Bổ sung driver bị thiếu
  minio_data:
    driver: local
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
