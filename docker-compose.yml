version: '3.9'

services:
  redis:
    image: redis:7.2-alpine
    container_name: meeting-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:16
    container_name: meeting-postgres
    restart: always
    environment:
      POSTGRES_DB: meetingplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meeting-network # Fix: Thêm mạng để Keycloak nhìn thấy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongodb:
    image: mongo:7.0
    container_name: meeting-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: meetingplatform_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G # Giới hạn không cho Mongo ăn hết RAM cache

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: meeting-keycloak
    command: start-dev --http-enabled=true --hostname-strict-https=false
    restart: always
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/meetingplatform
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - meeting-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: meeting-livekit
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    command:
      - --config
      - /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  livekit-egress:
    image: livekit/egress:latest
    container_name: meeting-egress
    restart: always # Thêm để đảm bảo tính sẵn sàng cao
    privileged: true
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    command:
      - --config
      - /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - livekit
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3500M
  minio:
    image: minio/minio:latest
    container_name: meeting-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - meeting-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  coturn:
    image: coturn/coturn:latest
    container_name: meeting-coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - -n --min-port=49152 --max-port=49160
      - --realm=meeting.manhduc --user=ducit:ducpass123
    networks:
      - meeting-network # Fix: Thêm mạng
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: meeting-cloudflare-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - meeting-network
networks:
  meeting-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local # Fix: Bổ sung driver bị thiếu
  mongodb_data:
    driver: local
  minio_data:
    driver: local