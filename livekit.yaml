port: 7880
bind_addresses:
  - ""
keys:
  livekit_api_key_2026: "livekit_api_secret_2026_super_secure"

logging:
  level: info

# Ép hệ thống dùng Opus Bitrate thấp để tiết kiệm băng thông
audio:
  min_bitrate: 16000
  max_bitrate: 24000
  user_pacing: true

# Bật Simulcast và Dynacast để giảm tải CPU Server
video:
  dynacast: true

room:
  empty_timeout: 300 # Tự giải tán phòng sau 5 phút không có ai
#  max_participants: 50 # Giới hạn an toàn cho mỗi phòng