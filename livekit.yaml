port: 7880
bind_addresses:
  - ""
keys:
  livekit_api_key_2026: "livekit_api_secret_2026_super_secure"

# 🔴 BẮT BUỘC BỔ SUNG BLOCK NÀY: Kết nối LiveKit Server với Redis trong Docker Network
redis:
  address: redis:6379 # Điền chính xác "Tên_Service_Redis" trong file docker-compose của em
  password: ""
  db: 0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Required on a public VM behind Docker/NAT. It is also safe for local Docker
  # testing because host candidates remain available.
  use_external_ip: true
webhook:
  api_key: livekit_api_key_2026
  urls:
    - "http://backend:8081/api/v1/webhooks/livekit/egress"
