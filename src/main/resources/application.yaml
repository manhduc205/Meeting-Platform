server:
  port: 8081

spring:
  application:
    name: meetingplatform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetingplatform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Set FLYWAY_BASELINE_ON_MIGRATE=true only once for an existing database.
    # Fresh environments must run V1 and V2 normally.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # Điền pass vào đây nếu máy bạn có cài, không thì để trống
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/meetingplatform}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:meeting}
    password: ${RABBITMQ_PASSWORD:meeting123}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_URI}
app:
  websocket:
    endpoint: "/ws/meeting"
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:4200,https://meeting.videoconnect.click}
    broker-topic-prefix: "/topic"
    broker-queue-prefix: "/queue"
    app-destination-prefix: "/app"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://127.0.0.1:5500,https://meeting.videoconnect.click}

  livekit:
    host: ${LIVEKIT_HOST:http://localhost:7880} # Internal server SDK URL (http/https)
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880} # Browser SDK URL (ws/wss)
    api-key: ${LIVEKIT_API_KEY:livekit_api_key_2026}
    api-secret: ${LIVEKIT_API_SECRET:livekit_api_secret_2026_super_secure}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Endpoint embedded in the LiveKit Egress request. It must be reachable
    # from the Egress container, independently from the backend client URL.
    egress-endpoint: ${MINIO_EGRESS_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:meeting-recordings}
    max-transcript-bytes: ${MINIO_MAX_TRANSCRIPT_BYTES:52428800}
  recording-ai:
    publisher-confirm-timeout-seconds: ${RECORDING_AI_CONFIRM_TIMEOUT_SECONDS:10}
    max-consumer-retries: ${RECORDING_AI_MAX_CONSUMER_RETRIES:3}
  recording-deletion:
    enabled: ${RECORDING_DELETION_ENABLED:true}
    trash-retention-days: ${RECORDING_TRASH_RETENTION_DAYS:3}
    fixed-delay-ms: ${RECORDING_DELETION_POLL_DELAY_MS:60000}
  webrtc:
    stun-url: stun:stun.l.google.com:19302
    turn-url: ${TURN_URL:turn:localhost:3478}
    turn-username: ${TURN_USERNAME:ducit}
    turn-password: ${TURN_PASSWORD:ducpass123}
  notifications:
    outbox:
      polling-enabled: ${OUTBOX_POLLING_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_POLLING_DELAY_MS:10000}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM_EMAIL:Meeting Platform <onboarding@resend.dev>}
    public-base-url: ${PUBLIC_APP_URL:http://localhost:4200}
