server:
  port: 8081

spring:
  application:
    name: meetingplatform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetingplatform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # Điền pass vào đây nếu máy bạn có cài, không thì để trống
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_URI}
app:
  websocket:
    endpoint: "/ws/meeting"
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:4200,https://meeting.videoconnect.click}
    broker-topic-prefix: "/topic"
    broker-queue-prefix: "/queue"
    app-destination-prefix: "/app"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://127.0.0.1:5500,https://meeting.videoconnect.click}

  livekit:
    host: ${LIVEKIT_HOST:http://localhost:7880} # Internal server SDK URL (http/https)
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880} # Browser SDK URL (ws/wss)
    api-key: ${LIVEKIT_API_KEY:livekit_api_key_2026}
    api-secret: ${LIVEKIT_API_SECRET:livekit_api_secret_2026_super_secure}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: meeting-recordings
  webrtc:
    stun-url: stun:stun.l.google.com:19302
    turn-url: ${TURN_URL:turn:localhost:3478}
    turn-username: ${TURN_USERNAME:ducit}
    turn-password: ${TURN_PASSWORD:ducpass123}
